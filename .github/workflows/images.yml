name: Images

# Reusable: build the four images, gate each on a Trivy HIGH/CRITICAL scan, push to GHCR, sign the
# pushed digest with cosign (keyless OIDC) and attach a CycloneDX SBOM attestation.
on:
  workflow_call:
    inputs:
      tag:
        description: Image tag to publish (e.g. v1.2.3 or sha-<commit>)
        required: true
        type: string
    outputs:
      tag:
        description: The published tag
        value: ${{ inputs.tag }}

permissions:
  contents: read

jobs:
  image:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      # Build and scan every image even when one fails, so one run shows every problem.
      fail-fast: false
      matrix:
        image: [api, worker, web, agent]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/veritas-${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (local, for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.${{ matrix.image }}
          target: runtime
          load: true
          push: false
          tags: ${{ env.IMAGE }}:scan
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Trivy image gate (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.2
          image-ref: ${{ env.IMAGE }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
      - name: Push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.${{ matrix.image }}
          target: runtime
          push: true
          provenance: mode=max
          tags: ${{ env.IMAGE }}:${{ inputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.tag }}
          cache-from: type=gha,scope=${{ matrix.image }}
      - uses: sigstore/cosign-installer@v3
      - name: Sign image digest (keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: SBOM (CycloneDX) for the image
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          output-file: veritas-${{ matrix.image }}.cdx.json
          artifact-name: veritas-${{ matrix.image }}-image.cdx.json
      - name: Attest SBOM
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign attest --yes --type cyclonedx --predicate "veritas-${{ matrix.image }}.cdx.json" "${IMAGE}@${DIGEST}"
      - name: Record digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: echo "${IMAGE}@${DIGEST}" > "digest-${{ matrix.image }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}
          path: digest-${{ matrix.image }}.txt
