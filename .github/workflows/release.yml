name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  binaries:
    name: Binaries (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
          - os: macos-14
            target: aarch64-apple-darwin
            ext: ""
          - os: macos-14
            target: x86_64-apple-darwin
            ext: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build (locked)
        shell: bash
        run: cargo build --release --locked --bins --target "${{ matrix.target }}"
      - name: Stage binaries
        shell: bash
        run: |
          mkdir -p dist
          for b in veritas veritas-verify veritas-agent fs-tool ewf-tool veritas-artifacts-dump; do
            cp "target/${{ matrix.target }}/release/${b}${{ matrix.ext }}" dist/
          done
      - name: Sign Windows binaries (signtool)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERT_PFX_BASE64) { throw "WINDOWS_CERT_PFX_BASE64 secret is required for releases" }
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          try {
            Get-ChildItem dist\*.exe | ForEach-Object {
              & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfx /p $env:WINDOWS_CERT_PASSWORD $_.FullName
              if ($LASTEXITCODE -ne 0) { throw "signtool sign failed for $($_.Name)" }
              & $signtool.FullName verify /pa /v $_.FullName
              if ($LASTEXITCODE -ne 0) { throw "signtool verify failed for $($_.Name)" }
            }
          } finally {
            Remove-Item $pfx -Force
          }
      - name: Sign and notarize macOS binaries (codesign + notarytool)
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${MACOS_CERT_P12_BASE64}" || { echo "MACOS_CERT_P12_BASE64 secret is required for releases"; exit 1; }
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"
          for f in dist/*; do
            codesign --force --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$f"
            codesign --verify --strict --verbose=2 "$f"
          done
          ditto -c -k --keepParent dist "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          security delete-keychain "$KEYCHAIN"
      - name: Archive
        shell: bash
        run: |
          name="veritas-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p out
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "out/${name}.zip" ./dist/*
          else
            tar -C dist -czf "out/${name}.tar.gz" .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: out/*

  agent-musl:
    name: Static Linux agent (musl)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build static veritas-agent
        run: docker buildx build -f deploy/docker/Dockerfile.agent --target artifact --output type=local,dest=dist/agent .
      - name: Archive
        run: |
          mkdir -p out
          tar -C dist/agent -czf "out/veritas-agent-${GITHUB_REF_NAME}-x86_64-unknown-linux-musl.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: bin-agent-musl
          path: out/*

  images:
    name: Images
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/images.yml
    with:
      tag: ${{ github.ref_name }}

  publish:
    name: Sign, SBOM, publish
    needs: [binaries, agent-musl, images]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: release
          merge-multiple: true
      # THREAT:T7.2 CycloneDX SBOM of the source tree (Rust, Python and npm dependencies) attached to every release.
      - name: SBOM (syft, CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: release/veritas-${{ github.ref_name }}.cdx.json
          upload-artifact: false
      - name: Checksums
        working-directory: release
        run: sha256sum -- * > SHA256SUMS
      - uses: sigstore/cosign-installer@v3
      # THREAT:T7.3 Every release file is signed with cosign keyless (GitHub OIDC -> Fulcio, logged in Rekor);
      # verification: docs/SECURITY.md.
      - name: cosign sign-blob (keyless)
        working-directory: release
        run: |
          for f in *; do
            case "$f" in *.sigstore.json) continue ;; esac
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - name: Verify one signature before publishing
        working-directory: release
        run: |
          cosign verify-blob --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
