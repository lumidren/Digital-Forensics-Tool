[workspace]
resolver = "2"
members = [
    "crates/veritas-hash",
    "crates/veritas-ledger",
    "crates/veritas-store",
    "crates/veritas-ewf",
    "crates/veritas-agent",
    "crates/veritas-fs",
    "crates/veritas-artifacts",
    "crates/veritas-timeline",
    "crates/veritas-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["lumidren"]
repository = "https://github.com/lumidren/Digital-Forensics-Tool"
rust-version = "1.80"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
hex = "0.4"
md-5 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
digest = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8", "pem"] }
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
byteorder = "1"
flate2 = "1"
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
sysinfo = "0.32"
tempfile = "3"
proptest = "1"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
debug = 1
