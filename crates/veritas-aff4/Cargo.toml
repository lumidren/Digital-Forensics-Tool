[package]
name = "veritas-aff4"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "AFF4 Standard v1.0 (aff4:ImageStream in a ZIP64 volume) disk-image writer and reader"

[[bin]]
name = "aff4-tool"
path = "src/bin/aff4-tool.rs"

[dependencies]
veritas-hash = { path = "../veritas-hash" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
hex.workspace = true
chrono.workspace = true
clap.workspace = true
digest.workspace = true
md-5.workspace = true
sha2.workspace = true
uuid.workspace = true
flate2 = { workspace = true, features = ["zlib-rs"] }
sha1 = "0.10"
crc32fast = "1.4"
snap = "1.1"
lz4_flex = { version = "0.11", default-features = false, features = ["safe-decode", "safe-encode", "std"] }

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true
rand.workspace = true
