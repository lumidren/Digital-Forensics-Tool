[package]
name = "veritas-fs"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "File-system and volume parsers (MBR/GPT, NTFS, FAT/exFAT, ext2/3/4, APFS, VSS), carving and recovery"

[[bin]]
name = "fs-tool"
path = "src/bin/fs-tool.rs"

[dependencies]
veritas-hash = { path = "../veritas-hash" }
veritas-ewf = { path = "../veritas-ewf" }
veritas-timeline = { path = "../veritas-timeline" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
hex.workspace = true
byteorder.workspace = true
chrono.workspace = true
clap.workspace = true
crc32fast = "1.4"

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true
