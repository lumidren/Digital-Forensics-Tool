{{- $ops := dict "ctx" $ "component" "ops" -}}
{{- if .Values.custodyVerify.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "veritas.fullname" . }}-custody-verify
  labels:
    {{- include "veritas.componentLabels" $ops | nindent 4 }}
spec:
  schedule: {{ .Values.custodyVerify.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 18000
      template:
        metadata:
          labels:
            {{- include "veritas.componentLabels" $ops | nindent 12 }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ .Values.serviceAccounts.ops.name }}
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: custody-verify
              image: {{ include "veritas.image" (dict "ctx" $ "image" .Values.api.image) }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["python", "/opt/veritas/ops/custody_verify.py"]
              envFrom:
                - configMapRef:
                    name: {{ include "veritas.fullname" . }}-config
              env:
                {{- include "veritas.env" . | nindent 16 }}
                - name: VERITAS_PUSHGATEWAY_URL
                  value: {{ .Values.metrics.pushgateway.url | quote }}
              securityContext:
                {{- toYaml .Values.containerSecurityContext | nindent 16 }}
              resources:
                {{- toYaml .Values.custodyVerify.resources | nindent 16 }}
              volumeMounts:
                {{- include "veritas.volumeMounts" . | nindent 16 }}
                - name: ops-scripts
                  mountPath: /opt/veritas/ops
                  readOnly: true
          volumes:
            {{- include "veritas.dataVolume" . | nindent 12 }}
            - name: tmp
              emptyDir:
                sizeLimit: 1Gi
            - name: ops-scripts
              configMap:
                name: {{ include "veritas.fullname" . }}-ops-scripts
{{- end }}
---
{{- if .Values.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "veritas.fullname" . }}-backup
  labels:
    {{- include "veritas.componentLabels" $ops | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 1800
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 10800
      template:
        metadata:
          labels:
            {{- include "veritas.componentLabels" $ops | nindent 12 }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ .Values.serviceAccounts.ops.name }}
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: backup
              image: {{ include "veritas.image" (dict "ctx" $ "image" .Values.api.image) }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command:
                - python
                - /opt/veritas/scripts/backup/backup.py
                - create
                - --out
                - /scratch
                {{- with .Values.backup.uploadUrl }}
                - --upload
                - {{ . | quote }}
                {{- end }}
                {{- with .Values.backup.clickhouseTarget }}
                - --clickhouse-target
                - {{ . | quote }}
                {{- end }}
              envFrom:
                - configMapRef:
                    name: {{ include "veritas.fullname" . }}-config
              env:
                {{- include "veritas.env" . | nindent 16 }}
                - name: VERITAS_BACKUP_RECIPIENT
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secret.name }}
                      key: VERITAS_BACKUP_RECIPIENT
                - name: VERITAS_PUSHGATEWAY_URL
                  value: {{ .Values.metrics.pushgateway.url | quote }}
              securityContext:
                {{- toYaml .Values.containerSecurityContext | nindent 16 }}
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
              volumeMounts:
                {{- include "veritas.volumeMounts" . | nindent 16 }}
                - name: scratch
                  mountPath: /scratch
          volumes:
            {{- include "veritas.dataVolume" . | nindent 12 }}
            - name: tmp
              emptyDir:
                sizeLimit: 2Gi
            - name: scratch
              emptyDir:
                sizeLimit: {{ .Values.backup.scratchSizeLimit }}
{{- end }}
