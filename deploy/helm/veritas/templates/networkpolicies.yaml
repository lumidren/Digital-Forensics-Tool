{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
{{- $api := dict "ctx" $ "component" "api" }}
{{- $worker := dict "ctx" $ "component" "worker" }}
{{- $web := dict "ctx" $ "component" "web" }}
{{- $ops := dict "ctx" $ "component" "ops" }}
# Default deny: nothing in the release may send or receive traffic unless a policy below allows it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "veritas.fullname" . }}-default-deny
  labels:
    {{- include "veritas.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# DNS for every pod (CoreDNS in kube-system).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "veritas.fullname" . }}-dns
  labels:
    {{- include "veritas.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
# API: from the ingress controller, the web tier and Prometheus; to Postgres, ClickHouse, the AWS
# interface endpoints (S3, KMS, STS) and the OpenTelemetry collector.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "veritas.fullname" . }}-api
  labels:
    {{- include "veritas.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "veritas.selector" $api | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.ingressNamespace }}
        - podSelector:
            matchLabels:
              {{- include "veritas.selector" $web | nindent 14 }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.monitoringNamespace }}
      ports:
        - {protocol: TCP, port: {{ .Values.api.port }}}
  egress:
    - to:
        {{- range $np.postgresCidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - {protocol: TCP, port: {{ $np.postgresPort }}}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.clickhouse.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml $np.clickhouse.podLabels | nindent 14 }}
      ports:
        - {protocol: TCP, port: {{ $np.clickhouse.port }}}
    - to:
        {{- range $np.awsEndpointCidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - {protocol: TCP, port: 443}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.monitoringNamespace }}
      ports:
        - {protocol: TCP, port: 4318}
    {{- with $np.apiExtraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
---
# Worker: no ingress at all; egress only to the case database, the timeline store and the evidence
# store (S3/KMS/STS endpoints). No internet, no OTel, no other pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "veritas.fullname" . }}-worker
  labels:
    {{- include "veritas.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "veritas.selector" $worker | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        {{- range $np.postgresCidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - {protocol: TCP, port: {{ $np.postgresPort }}}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.clickhouse.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml $np.clickhouse.podLabels | nindent 14 }}
      ports:
        - {protocol: TCP, port: {{ $np.clickhouse.port }}}
    - to:
        {{- range $np.awsEndpointCidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - {protocol: TCP, port: 443}
---
# Web: from the ingress controller only; egress to the API only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "veritas.fullname" . }}-web
  labels:
    {{- include "veritas.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "veritas.selector" $web | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.ingressNamespace }}
      ports:
        - {protocol: TCP, port: {{ .Values.web.port }}}
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "veritas.selector" $api | nindent 14 }}
      ports:
        - {protocol: TCP, port: {{ .Values.api.port }}}
---
# Operations CronJobs (custody verification, backups): same data paths as the API plus the Pushgateway.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "veritas.fullname" . }}-ops
  labels:
    {{- include "veritas.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "veritas.selector" $ops | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        {{- range $np.postgresCidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - {protocol: TCP, port: {{ $np.postgresPort }}}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.clickhouse.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml $np.clickhouse.podLabels | nindent 14 }}
      ports:
        - {protocol: TCP, port: {{ $np.clickhouse.port }}}
    - to:
        {{- range $np.awsEndpointCidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - {protocol: TCP, port: 443}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.monitoringNamespace }}
      ports:
        - {protocol: TCP, port: 9091}
{{- end }}
