apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: veritas
  labels:
    helm.sh/chart: veritas-0.1.0
    app.kubernetes.io/name: veritas
    app.kubernetes.io/instance: veritas
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: veritas
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Strict-Transport-Security: max-age=63072000; includeSubDomains; preload";
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - staging.veritas.example.org
      secretName: veritas-staging-tls
  rules:
    - host: staging.veritas.example.org
      http:
        paths:
          # Only the API surface is routed to the API; /metrics, /healthz and /readyz stay cluster-internal.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: veritas-api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: veritas-web
                port:
                  name: http
