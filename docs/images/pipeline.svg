<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Processing pipeline for one evidence item</title>
  <desc id="d">Verify, file-system timeline, harvest and per-artifact parsing in sandboxed workers, then analytics; measured seconds for the 4.87 GB NIST Hacking Case image.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#141b30"/></linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8aa4c8"/></marker>
  </defs>
  <rect width="1200" height="330" rx="18" fill="url(#bg)"/>
  <text x="40" y="48" fill="#e6edf7" font-size="22" font-weight="700">One image, no manual steps</text>
  <text x="40" y="74" fill="#8aa4c8" font-size="14">Resumable DAG with leased job claims · measured on the NIST CFReDS Hacking Case (4.87 GB, one worker)</text>
  <g font-size="12.5">
    <rect x="40" y="105" width="160" height="110" rx="12" fill="#1b2a45" stroke="#f59e0b"/>
    <text x="56" y="135" fill="#e6edf7" font-size="15" font-weight="700">Store</text>
    <text x="56" y="158" fill="#fcd9a0">WORM · 3 hashes</text>
    <text x="56" y="178" fill="#fcd9a0">signed ingest</text>
    <text x="56" y="203" fill="#e6edf7" font-weight="700">9.5 s</text>
    <rect x="230" y="105" width="160" height="110" rx="12" fill="#1b2a45" stroke="#34d399"/>
    <text x="246" y="135" fill="#e6edf7" font-size="15" font-weight="700">Verify</text>
    <text x="246" y="158" fill="#a7f3d0">re-hash every</text>
    <text x="246" y="178" fill="#a7f3d0">stored segment</text>
    <text x="246" y="203" fill="#e6edf7" font-weight="700">7.6 s</text>
    <rect x="420" y="105" width="190" height="110" rx="12" fill="#1b2a45" stroke="#22d3ee"/>
    <text x="436" y="135" fill="#e6edf7" font-size="15" font-weight="700">File-system timeline</text>
    <text x="436" y="158" fill="#a5f3fc">E01 → MBR → NTFS</text>
    <text x="436" y="178" fill="#a5f3fc">225,980 events</text>
    <text x="436" y="203" fill="#e6edf7" font-weight="700">35.7 s</text>
    <rect x="640" y="105" width="240" height="110" rx="12" fill="#1b2a45" stroke="#f472b6"/>
    <text x="656" y="135" fill="#e6edf7" font-size="15" font-weight="700">Harvest + sandboxed parse</text>
    <text x="656" y="158" fill="#fbcfe8">126 artifacts · signed transforms</text>
    <text x="656" y="178" fill="#fbcfe8">registry · EVT · prefetch · LNK · IE</text>
    <text x="656" y="203" fill="#e6edf7" font-weight="700">71.0 s</text>
    <rect x="910" y="105" width="250" height="110" rx="12" fill="#1b2a45" stroke="#f87171"/>
    <text x="926" y="135" fill="#e6edf7" font-size="15" font-weight="700">Analytics</text>
    <text x="926" y="158" fill="#fecaca">13 proposed findings</text>
    <text x="926" y="178" fill="#fecaca">Cain · Ethereal · NetStumbler …</text>
    <text x="926" y="203" fill="#e6edf7" font-weight="700">10.2 s</text>
  </g>
  <path d="M200 160 H230" stroke="#8aa4c8" stroke-width="2" marker-end="url(#a)"/>
  <path d="M390 160 H420" stroke="#8aa4c8" stroke-width="2" marker-end="url(#a)"/>
  <path d="M610 160 H640" stroke="#8aa4c8" stroke-width="2" marker-end="url(#a)"/>
  <path d="M880 160 H910" stroke="#8aa4c8" stroke-width="2" marker-end="url(#a)"/>
  <!-- time bar -->
  <text x="40" y="258" fill="#8aa4c8" font-size="12">wall-clock, 134 s total ≈ 130 GB/h of media</text>
  <g transform="translate(40,268)">
    <rect width="1120" height="22" rx="6" fill="#1b2a45"/>
    <rect x="0" width="79" height="22" rx="6" fill="#f59e0b"/>
    <rect x="79" width="64" height="22" fill="#34d399"/>
    <rect x="143" width="298" height="22" fill="#22d3ee"/>
    <rect x="441" width="594" height="22" fill="#f472b6"/>
    <rect x="1035" width="85" height="22" rx="6" fill="#f87171"/>
  </g>
</svg>
